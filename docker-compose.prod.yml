x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  - no-new-privileges:true

services:
  nginx:
    image: ${FRONTEND_IMAGE:-vietnam-travel-advisor-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    security_opt: *default-security
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:-vietnam-travel-advisor-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    security_opt: *default-security
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /home/app/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /home/app/.cache/huggingface/sentence_transformers
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - huggingface_cache:/home/app/.cache/huggingface
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - edge
      - data
    logging: *default-logging
    stop_grace_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt: *default-security
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    security_opt: *default-security
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - data
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    security_opt: *default-security
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - data
    logging: *default-logging
    stop_grace_period: 60s

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  qdrant_snapshots:
  huggingface_cache:
