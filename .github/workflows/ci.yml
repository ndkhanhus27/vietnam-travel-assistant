name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cpu.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-cpu.txt -r requirements-test.txt
      - run: python -m compileall -q backend/app backend/pipeline backend/evaluation
      - name: Test nodes, tools and deterministic evaluation helpers
        working-directory: backend
        run: python -m pytest -q -m unit

  backend-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vta_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vta_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vta_ci
      JWT_SECRET_KEY: ci-only-secret-that-is-longer-than-32-characters
      GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
      REDIS_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cpu.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-cpu.txt -r requirements-test.txt
      - run: alembic upgrade head
        working-directory: backend
      - name: Test graph flow, state, services and API contracts
        working-directory: backend
        run: python -m pytest -q -m "integration or contract or services"

  frontend-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:components
        working-directory: frontend
      - run: npm run test:streaming
        working-directory: frontend
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

  e2e-mock-llm:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vta_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vta_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vta_ci
      JWT_SECRET_KEY: ci-only-secret-that-is-longer-than-32-characters
      GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
      REDIS_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      E2E_API_URL: http://127.0.0.1:8010/api/v1
      E2E_MOCK_BACKEND: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cpu.txt
            requirements-test.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-cpu.txt -r requirements-test.txt
      - run: alembic upgrade head
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Test responsive UI and full mocked-LLM chat flow
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git diff --check
